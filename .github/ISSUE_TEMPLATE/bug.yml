name: Bug Report
description: Report a problem or unexpected behavior.
title: "[BUG] "
labels:
  - bug

body:
  - type: textarea
    id: description
    attributes:
      label: What is the problem?
      description: Describe what is happening.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to reproduce?
      description: Provide step-by-step instructions to reproduce the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true