name: Feature Request
description: Suggest a new feature.
title: "[FEATURE] "
labels:
  - feature

body:
  - type: textarea
    id: implementation
    attributes:
      label: What needs to be done?
      description: Describe the feature that should be implemented.
    validations:
      required: true

  - type: textarea
    id: changes
    attributes:
      label: Will this change anything?
      description: If yes, describe what will be changed (API, database, UI, existing behavior, etc.).
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Why should this feature be implemented?
      description: Explain why this feature is needed and what problem it solves.
    validations:
      required: true